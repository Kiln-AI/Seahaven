[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projecttracker"
version = "1.0.0"
description = "ProjectTracker: Seahaven's reference world, a fictional issue tracker."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Steve Cosman" }]
# A world depends on the framework and never the other way round. A world
# generated by `seahaven new` outside this repository pins a release
# (`seahaven~=X.Y`); this one is developed with the framework in one tree, so it
# takes whatever `seahaven` the workspace has.
dependencies = ["seahaven"]

[project.optional-dependencies]
serve = ["seahaven[serve]"]

[tool.uv.sources]
seahaven = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/projecttracker"]

# The world is its own package with its own suite: `uv run pytest worlds/projecttracker`
# from the repository root, or `uv run pytest` from here. Having its own section is
# what makes this directory the rootdir of that run, so its test modules are named
# independently of the framework's.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
