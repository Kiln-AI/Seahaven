# uv's build backend, the framework's own. `src/projecttracker` is what it packages
# -- `module-root` defaults to `src`, and the module is the project name -- and
# every file under it travels, so `schema/*.sql` reaches `importlib.resources` in
# an installed world. `fixtures/` is outside the package and deliberately does not:
# a fixture is a checkout's file, not a distribution's (`docs/db_schema_and_fixtures.md`).
[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[project]
name = "projecttracker"
version = "1.0.0"
description = "ProjectTracker: Seahaven's reference world, a fictional issue tracker."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Steve Cosman" }]
# A world depends on the framework and never the other way round. A world
# generated by `seahaven new` outside this repository pins a release
# (`seahaven~=X.Y`); this one is developed with the framework in one tree, so it
# takes whatever `seahaven` the workspace has.
dependencies = ["seahaven"]

# Each line re-exports one of the framework's extras, because `uv sync --extra
# serve` in this directory resolves against this package's extras and not
# seahaven's. `serve` and `mcp` cannot be installed together: openenv pins the
# MCP SDK a major version below the one `seahaven mcp` is written against. A
# world outside this repository also declares that conflict itself, which is
# what `seahaven new` writes; this one is a workspace member, so the root
# `pyproject.toml`'s declaration already covers it.
[project.optional-dependencies]
serve = ["seahaven[serve]"]
mcp = ["seahaven[mcp]"]

[tool.uv.sources]
seahaven = { workspace = true }

# The world is its own package with its own suite: `uv run pytest worlds/projecttracker`
# from the repository root, or `uv run pytest` from here. Having its own section is
# what makes this directory the rootdir of that run, so its test modules are named
# independently of the framework's.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
