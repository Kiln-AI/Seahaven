[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seahaven"
version = "0.0.1"
description = "A framework for building synthetic worlds/environments for AI agents. Useful for RL and evaluations."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Steve Cosman" }]
keywords = ["ai", "agents", "rl", "evaluation", "environments", "simulation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "apsw>=3.53",
    "pydantic>=2.12,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
serve = ["openenv>=0.4.2,<0.5"]

[project.scripts]
seahaven = "seahaven.cli:main"

# Installing `seahaven` activates its pytest plugin: a world's tests use the
# `world` and `instance` fixtures by name, with nothing in a `conftest.py`.
[project.entry-points.pytest11]
seahaven = "seahaven.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Kiln-AI/Seahaven"

[dependency-groups]
# `projecttracker` is the reference world, in this repository and developed with
# the framework. It is a dev dependency of `seahaven` and never a runtime one:
# the dependency runs the other way.
dev = ["packaging>=24", "projecttracker", "pytest>=8", "ruff>=0.14", "ty>=0.0.1a21"]

[tool.uv.workspace]
members = ["worlds/*"]

[tool.uv.sources]
projecttracker = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/seahaven"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "worlds/projecttracker/src", "worlds/projecttracker/tests"]
# The specs are documents. Their code blocks are sketches, not code that runs.
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests", "scripts", "worlds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An exception on a thread a test started is otherwise a warning printed beside
# a passing test, which is no way to test a lock.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
# `slow` is the 500-session smoke test and anything else that is measured in
# tens of seconds: always run in CI, deselectable with `-m "not slow"` locally.
markers = ["slow: takes tens of seconds; deselect with -m 'not slow'"]
