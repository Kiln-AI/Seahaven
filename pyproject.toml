[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seahaven"
version = "0.0.1"
description = "A framework for building synthetic worlds/environments for AI agents. Useful for RL and evaluations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Steve Cosman" }]
keywords = ["ai", "agents", "rl", "evaluation", "environments", "simulation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/scosman/Seahaven"

[tool.hatch.build.targets.wheel]
packages = ["src/seahaven"]
