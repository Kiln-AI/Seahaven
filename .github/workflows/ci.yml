name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Types
        run: uv run ty check

      - name: Tests
        run: uv run pytest

      # The reference world is its own package with its own suite, and its own
      # pytest rootdir: a world is tested the way a world's author tests one.
      - name: Reference world tests
        run: uv run pytest worlds/projecttracker

      # Seahaven is vendored into other people's products: what it installs at
      # runtime stays MIT, Apache-2.0 or BSD-class.
      - name: Dependency licences
        run: uv run python scripts/check_licences.py
